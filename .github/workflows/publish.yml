name: publish

# Publishing is deliberately only reachable two ways: a GitHub Release, or a
# manual run by someone with write access. There is no push trigger — landing a
# commit on main must never be able to ship a version to customers by itself.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a recent npm; the one bundled with the runner's
      # node may predate it.
      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile --ignore-scripts

      # Republish the full gate here rather than trusting that CI passed on some
      # earlier commit: this is the exact tree that becomes the tarball.
      - run: bunx biome ci .
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser

      # A release tag that disagrees with package.json ships a version nobody
      # can find. Fail before publishing, not after.
      - name: tag matches package.json version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p 'require("./package.json").version')
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag != package.json $pkg" >&2
            exit 1
          fi

      - name: Pack the verified npm package
        run: mkdir -p release-package && npm pack --ignore-scripts --pack-destination release-package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: release-package/*.tgz
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    # npm trusted publishing requires a GitHub-hosted runner. Keep only the
    # final publish here; builds and tests run on Blacksmith.
    # https://docs.npmjs.com/trusted-publishers/
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: release-package
      - run: npm publish release-package/*.tgz --ignore-scripts
