version: 2
updates:
  # The two runtime deps are the whole attack surface customers inherit, so we
  # want to hear about them. Weekly, grouped, so it's one PR to review.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      opentelemetry:
        patterns: ["@opentelemetry/*", "@hyperdx/*"]
      dev:
        dependency-type: development

  # Actions are pinned by sha, which means nothing updates them but this.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
